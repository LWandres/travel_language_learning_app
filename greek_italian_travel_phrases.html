<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rome & Greek Isles — Travel Phrases</title>
<!-- Pinned version, no integrity attribute (avoids SRI mismatch on GitHub Pages) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f9f7;color:#1a1a1a;padding:1rem}
.app{padding:1rem;max-width:700px;margin:0 auto}
.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:20px;font-weight:500;margin-bottom:4px}
.header p{font-size:13px;color:#666}
.progress-bar{height:4px;background:#e8e8e5;border-radius:4px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#1D9E75;border-radius:4px;transition:width 0.3s ease}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem;justify-content:center}
.cat-btn{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.cat-btn:hover{background:#f0f0ee}
.cat-btn.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500}
.phrase-counter{font-size:13px;color:#666;text-align:center;margin-bottom:1rem}
.tip-banner{background:#f0f0ee;border-left:3px solid #EF9F27;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:1.5rem;font-size:13px;color:#555;line-height:1.5}
.tip-banner strong{color:#1a1a1a;font-weight:500}
.english-card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:1rem}
.english-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#aaa;margin-bottom:6px}
.english-phrase{font-size:22px;font-weight:500;line-height:1.3}
.english-context{font-size:12px;color:#888;margin-top:6px;font-style:italic}
.lang-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
@media(max-width:480px){.lang-cards{grid-template-columns:1fr}}
.flip-card{perspective:1000px;height:200px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.5s ease}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back-it,.flip-back-gr{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;border:1px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.flip-front-it{background:#faf5f0}
.flip-front-gr{background:#f0f5ff}
.flip-back-it{background:#1D9E75;border-color:#1D9E75;transform:rotateY(180deg)}
.flip-back-gr{background:#185FA5;border-color:#185FA5;transform:rotateY(180deg)}
.flag{font-size:28px;margin-bottom:6px}
.lang-label{font-size:11px;letter-spacing:0.5px;font-weight:500;margin-bottom:4px}
.lang-label-it{color:#B37A2A}
.lang-label-gr{color:#185FA5}
.phrase-translated{font-size:20px;font-weight:500;color:#fff;text-align:center;line-height:1.3;margin-bottom:4px}
.phrase-phonetic{font-size:13px;color:rgba(255,255,255,0.8);text-align:center;font-style:italic;margin-bottom:10px}
.audio-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:20px;padding:6px 16px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s}
.audio-btn:hover{background:rgba(255,255,255,0.35)}
.audio-btn:disabled{opacity:0.5;cursor:default}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:0.5rem}
.nav-btn{padding:8px 20px;border-radius:20px;border:1px solid #ccc;background:#fff;color:#1a1a1a;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:all 0.15s}
.nav-btn:hover{background:#f0f0ee}
.nav-btn:disabled{opacity:0.3;cursor:default}
.flip-all-btn{font-size:12px;color:#1D9E75;background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mastered-btn{padding:8px 16px;border-radius:20px;border:1px solid #639922;background:#EAF3DE;color:#3B6D11;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:5px;justify-content:center;transition:all 0.15s;margin-top:0.75rem;width:100%}
.mastered-btn:hover{background:#C0DD97}
.mastered-count{font-size:12px;color:#888;text-align:center;margin-top:8px}
.voice-panel{background:#f0f0ee;border-radius:8px;padding:10px 14px;margin-bottom:1rem;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.voice-row{display:flex;flex-direction:column;gap:4px}
.voice-label{font-size:11px;color:#aaa;letter-spacing:0.4px}
.voice-select{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;cursor:pointer;width:100%}
.voice-status{font-size:11px;color:#aaa;text-align:center;margin-top:6px;grid-column:1/-1;min-height:16px}
.phrase-large{font-size:18px;font-weight:500;text-align:center}
.flip-hint{font-size:11px;color:#aaa;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>🌍 Rome &amp; Greek Isles — travel phrases</h1>
  <p>Tap cards to flip · hear pronunciation · mark mastered</p>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="phrase-counter" id="phraseCounter"></div>
<div class="tip-banner" id="tipBanner"></div>

<div class="voice-panel">
  <div class="voice-row">
    <div class="voice-label">ITALIAN VOICE</div>
    <select class="voice-select" id="itVoiceSelect"><option>Loading voices...</option></select>
  </div>
  <div class="voice-row">
    <div class="voice-label">GREEK VOICE</div>
    <select class="voice-select" id="grVoiceSelect"><option>Loading voices...</option></select>
  </div>
  <div class="voice-status" id="voiceStatus">Loading voices — please wait a moment...</div>
</div>

<div class="english-card">
  <div class="english-label">English phrase</div>
  <div class="english-phrase" id="englishPhrase"></div>
  <div class="english-context" id="englishContext"></div>
</div>

<div class="lang-cards">
  <div class="flip-card" id="itCard">
    <div class="flip-inner">
      <div class="flip-front flip-front-it">
        <div class="flag">🇮🇹</div>
        <div class="lang-label lang-label-it">ITALIAN</div>
        <div class="phrase-large" id="itFront">—</div>
        <div class="flip-hint">tap to flip</div>
      </div>
      <div class="flip-back-it">
        <div style="font-size:22px;margin-bottom:2px">🇮🇹</div>
        <div class="phrase-translated" id="itPhrase"></div>
        <div class="phrase-phonetic" id="itPhonetic"></div>
        <button class="audio-btn" id="itAudioBtn">
          <i class="ti ti-volume"></i> hear it
        </button>
      </div>
    </div>
  </div>
  <div class="flip-card" id="grCard">
    <div class="flip-inner">
      <div class="flip-front flip-front-gr">
        <div class="flag">🇬🇷</div>
        <div class="lang-label lang-label-gr">GREEK</div>
        <div class="phrase-large" id="grFront">—</div>
        <div class="flip-hint">tap to flip</div>
      </div>
      <div class="flip-back-gr">
        <div style="font-size:22px;margin-bottom:2px">🇬🇷</div>
        <div class="phrase-translated" id="grPhrase"></div>
        <div class="phrase-phonetic" id="grPhonetic"></div>
        <button class="audio-btn" id="grAudioBtn">
          <i class="ti ti-volume"></i> hear it
        </button>
      </div>
    </div>
  </div>
</div>

<div style="text-align:center">
  <button class="flip-all-btn">flip both cards</button>
</div>

<button class="mastered-btn" id="masteredBtn">
  <i class="ti ti-check"></i> got it! mark as mastered
</button>
<div class="mastered-count" id="masteredCount"></div>

<div class="nav-row" style="margin-top:1rem">
  <button class="nav-btn" id="prevBtn" disabled>
    <i class="ti ti-arrow-left"></i> prev
  </button>
  <button class="nav-btn" id="nextBtn">
    next <i class="ti ti-arrow-right"></i>
  </button>
</div>
</div>

<!-- All JS in external file — no inline scripts, CSP-safe -->
<script src="app.js"></script>
</body>
</html>
